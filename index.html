<!DOCTYPE html>
<html lang="zh-cn">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
        <title>Morin's Home</title>
    </head>
    <body>
        <div class="container-fluid bg-dark text-white"> <!-- 全宽容器 --> <!-- 深色背景+白色文字 --> <!-- bg-primary是蓝色背景 -->
            <div class="container p-5"> <!-- pt-5 是顶部填充,p-5是顶部底部都填充,my-5是在容器之上填充 -->
                <h1>Morin的小站</h1>
                <!-- 一言-start -->
                <p id="hitokoto">
                    <a href="#" id="hitokoto_text">:D 获取中...</a>
                </p>
                <script>
                fetch("https://v1.hitokoto.cn/?c=a&b&c&f&l")
                    .then((response) => response.json())
                    .then((data) => {
                        const hitokoto = document.querySelector("#hitokoto_text");
                        hitokoto.href = `https://hitokoto.cn/?uuid=${data.uuid}`;
                        hitokoto.innerText = data.hitokoto;
                    })
                    .catch(console.error);
                </script>
                <!-- 一言-end -->
            </div>
        </div>
        <div class="container-fluid">
            <div class="container p-5 my-5 border">
                <a href="/pages/articles/p1.html"><h2>The First Article</h2></a>
                <p>This is the first article of morin's website</p>
            </div>
        </div>
        <script src="/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
        <script src="/js/popper.min.js" integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3" crossorigin="anonymous"></script>
        <script src="/js/bootstrap.min.js" integrity="sha384-cuYeSxntonz0PPNlHhBs68uyIAVpIIOZZ5JqeqvYYIcEL727kskC66kF92t6Xl2V" crossorigin="anonymous"></script>
    </body>
</html>
