<!-- 一言 -->
<p id="hitokoto" style="text-decoration: none;">
  <a href="#" id="hitokoto_text" target="_blank" rel="noopener noreferrer">:D 获取中...</a>
</p>
<script>
  fetch("https://v1.hitokoto.cn/?c=a&b&c&f&l")
    .then((response) => response.json())
    .then((data) => {
      const hitokoto = document.querySelector("#hitokoto_text");
      hitokoto.href = `https://hitokoto.cn/?uuid=${data.uuid}`;
      hitokoto.innerText = data.hitokoto;
    })
    .catch(console.error);
</script>
